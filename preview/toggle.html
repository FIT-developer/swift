<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toggle Switch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <link rel="stylesheet" href="./assets/css/base.css">
  <style>
    .toggle-btn {
      background-color: var(--color-switch-off-track);
    }
    .toggle-btn[aria-checked="true"] {
      background-color: var(--color-accent-green);
    }
    .toggle-btn:disabled,
    .toggle-btn:disabled[aria-checked="true"] {
      background-color: var(--color-switch-off-track);
      cursor: not-allowed;
    }
    .toggle-knob {
      transform: translateX(0);
    }
    .toggle-btn[aria-checked="true"] .toggle-knob {
      transform: translateX(21px);
    }
  </style>
</head>
<body class="min-h-screen bg-surface-default flex flex-col items-center justify-center gap-10 px-4">

  <h1 class="text-xl font-semibold text-text-default tracking-tight">Toggle Switch</h1>

  <div class="flex flex-col sm:flex-row items-center gap-8">

    <!-- Off state -->
    <label class="inline-flex items-center gap-3 cursor-pointer select-none">
      <span class="text-sm text-text-secondary w-8 text-right">Off</span>
      <button
        role="switch"
        aria-checked="false"
        data-toggle
        class="toggle-btn relative inline-flex shrink-0 w-16 h-7 p-0.5 rounded-full transition-colors duration-200 ease-in-out focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-radio-default)]"
      >
        <span
          data-knob
          class="toggle-knob inline-block w-[39px] h-6 rounded-full bg-white shadow-md pointer-events-none transition-transform duration-200 ease-in-out"
        ></span>
        <span class="sr-only">Toggle off</span>
      </button>
    </label>

    <!-- On state -->
    <label class="inline-flex items-center gap-3 cursor-pointer select-none">
      <span class="text-sm text-text-secondary w-8 text-right">On</span>
      <button
        role="switch"
        aria-checked="true"
        data-toggle
        class="toggle-btn relative inline-flex shrink-0 w-16 h-7 p-0.5 rounded-full transition-colors duration-200 ease-in-out focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-radio-default)]"
      >
        <span
          data-knob
          class="toggle-knob inline-block w-[39px] h-6 rounded-full bg-white shadow-md pointer-events-none transition-transform duration-200 ease-in-out"
        ></span>
        <span class="sr-only">Toggle on</span>
      </button>
    </label>

    <!-- Disabled state -->
    <label class="inline-flex items-center gap-3 cursor-not-allowed select-none">
      <span class="text-sm text-text-secondary w-16 text-right">Disabled</span>
      <button
        role="switch"
        aria-checked="true"
        disabled
        data-toggle
        class="toggle-btn relative inline-flex shrink-0 w-16 h-7 p-0.5 rounded-full transition-colors duration-200 ease-in-out focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-radio-default)]"
      >
        <span
          data-knob
          class="toggle-knob inline-block w-[39px] h-6 rounded-full bg-white shadow-md pointer-events-none transition-transform duration-200 ease-in-out"
        ></span>
        <span class="sr-only">Toggle disabled</span>
      </button>
    </label>

  </div>

  <!-- State display -->
  <div id="status" class="text-sm text-text-secondary">點擊任一 Toggle 切換狀態</div>

  <script>
    document.querySelectorAll('[data-toggle]:not(:disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        const isOn = btn.getAttribute('aria-checked') === 'true';
        btn.setAttribute('aria-checked', isOn ? 'false' : 'true');

        // Update status text
        const states = [...document.querySelectorAll('[data-toggle]')]
          .map(b => b.getAttribute('aria-checked') === 'true' ? 'On' : 'Off');
        document.getElementById('status').textContent =
          `Closure：${states[0]}　Open：${states[1]}　Disabled：${states[2]}`;
      });
    });
  </script>

</body>
</html>
