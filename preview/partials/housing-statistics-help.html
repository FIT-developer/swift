    <h2 id="hsHelpTitle">篩選條件</h2>
    <div class="hs-help-row"><span class="hs-help-label">訂房來源</span><p>可分實體、網路、官網訂房系統(所有有官網網路訂房系統進來的訂單，如：手機版、facebook、google、官網、自設渠道&#8230;等，透過官網訂房系統進來的訂單)、官網(單純直接進來的訂單)、公共渠道(hotelnabe、siteminder&#8230;等。)、自設渠道。</p></div>
