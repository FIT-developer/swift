==================================== -->
<div
  id="modalRoomTypeNewBackdrop"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalRoomTypeNewTitle"
>
  <div class="modal-box mx-3">
    <div
      class="modal-header-shadow flex h-[51px] flex-shrink-0 items-center justify-between border-b border-text-placeholder px-3"
    >
      <span id="modalRoomTypeNewTitle" class="text-xl font-semibold text-text-default"
        >資料新增</span
      >
      <button
        type="button"
        class="modal-close-btn flex h-6 w-6 cursor-pointer items-center justify-center opacity-70 hover:opacity-100"
        data-modal="modalRoomTypeNewBackdrop"
        aria-label="關閉"
      >
        <img src="./assets/icons/close.svg" alt="" class="h-6 w-6" />
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto bg-white p-5">
      <div
        class="grid grid-cols-1 min-[640px]:grid-cols-2 gap-x-5 gap-y-5"
        data-room-count-scope
        data-room-count-default="14"
      >
        <!-- Row1: 房間編號(disabled)+排序 | 房間名稱 -->
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <label class="w-16 shrink-0 text-base text-text-default">房間編號</label>
            <input type="text" value="4" disabled
              class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-[var(--color-neutral-100)] px-3 py-1.5 text-base text-text-secondary" />
          </div>
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <label class="w-16 shrink-0 text-base text-text-default">排序</label>
            <input type="text" value="1"
              class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-white px-3 py-1.5 text-base text-text-secondary outline-none focus:border-border-focus" />
          </div>
        </div>
        <div class="flex items-center gap-3">
          <label class="w-16 shrink-0 text-base text-text-default">房間名稱</label>
          <input type="text" value="placeholder"
            class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-white px-3 py-1.5 text-base text-text-secondary outline-none focus:border-border-focus" />
        </div>

        <!-- Row2: 房間代號 | 營運型態 -->
        <div class="flex items-center gap-3">
          <label class="w-16 shrink-0 text-base text-text-default">房間代號</label>
          <input type="text" value="TW"
            class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-white px-3 py-1.5 text-base text-text-secondary outline-none focus:border-border-focus" />
        </div>
        <div class="flex items-center gap-3">
          <label class="w-16 shrink-0 text-base text-text-default">營運型態</label>
          <select class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-white px-3 py-1.5 text-base text-text-default">
            <option>住宿</option>
            <option>非住宿</option>
          </select>
        </div>

        <!-- Row3: 床舖型態 | 房型類別 -->
        <div class="flex items-center gap-3">
          <label class="w-16 shrink-0 text-base text-text-default">床舖型態</label>
          <select class="flex-1 min-w-0 border border-border-disabled rounded-[6px] bg-white px-3 py-1.5 text-base text-text-default">
            <option>兩大床</option>

        <div class="flex items-center gap-3">
          <label class="w-16 shrink-0 text-base text-text-default">房型類別</label>

            <option>兩大床</option>
          </select>
        </div>

        <!-- Row4: 房間數 | 房數修改（房間數異動時顯示） -->
        <div class="flex items-start gap-3">
          <div class="w-16 shrink-0">
            <label class="block text-base text-text-default">房間數</label>
            <span class="hidden text-xs text-text-default" data-room-count-delta></span>

          <input

            min="0"

          />

        <div class="hidden items-center justify-between gap-3" data-room-inventory-row>

            <label class="text-base text-text-default">房數修改</label>
            <span class="text-xs text-text-default" data-room-inventory-hint>不更新房型庫存</span>
          </div>
          <span class="member-data-switch shrink-0">
            <input type="checkbox" data-room-inventory-toggle />
            <span class="member-data-switch-track"></span>
            <span class="member-data-switch-knob"></span>
          </span>
        </div>

        <!-- Row5: 網路訂購 toggle -->
        <div class="rt-network-row flex items-center justify-between gap-3" data-room-network-row>
          <label class="text-base text-text-default">網路訂購</label>

            <input type="checkbox" />
            <span class="member-data-switch-track"></span>
            <span class="member-data-switch-knob"></span>
          </span>
        </div>

        <div class="flex items-center gap-3 min-[640px]:col-span-2">
          <label for="roomTypeNewExtraPeople" class="w-16 shrink-0 text-base text-text-default">加人</label>
          <select
            id="roomTypeNewExtraPeople"
            data-room-extra-people
            class="flex-1 min-w-0 rounded-[6px] border border-border-disabled bg-white px-3 py-1.5 text-base text-text-default outline-none focus:border-border-focus"

            <option value="0">不可加人</option>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>

        <!-- 房間介紹文案 / 房間名稱文案 -->

          <label class="text-base text-text-default">房間介紹文案</label>
          <div id="roomTypeNewIntroCard"></div>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-base text-text-default">房間名稱文案</label>
          <div id="roomTypeNewNameCard"></div>
        </div>

        <!-- 房間設施項目 -->
        <div class="flex flex-col gap-2 min-[640px]:col-span-2">
          <label class="text-base text-text-default">房間設施項目</label>
          <div
            id="roomTypeNewFacilityChips"
            class="flex flex-wrap gap-4 rounded-xl border border-border-default bg-surface-hover p-5"
          >
            <button type="button" data-facility-selected="true" class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-pointer">設施一</button>
            <button type="button" data-facility-selected="false" class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-pointer">設施二</button>
            <button type="button" data-facility-selected="true" class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-pointer">設施三</button>
            <button type="button" data-facility-selected="false" class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-pointer">設施五六七八九</button>
          </div>
        </div>
      </div>
    </div>

    <div class="flex h-[58px] flex-shrink-0 items-center justify-end gap-2 border-t border-border-disabled px-3">

</div>

            <span class="member-data-switch-track"></span>
            <span class="member-data-switch-knob"></span>
          </span>
        </div>

        <!-- 加人 Select：查看模式固定為 2 並 disabled（0827） -->
        <div class="flex items-center gap-3 min-[640px]:col-span-2">
          <label for="roomTypeViewExtraPeople" class="w-16 shrink-0 text-base text-text-default">加人</label>
          <select
            id="roomTypeViewExtraPeople"
            data-room-extra-people
            disabled
            class="flex-1 min-w-0 rounded-[6px] border border-border-disabled bg-border-disabled px-3 py-1.5 text-base text-text-secondary"
          >
            <option value="0">不可加人</option>
            <option value="1">1</option>
            <option value="2" selected>2</option>
          </select>
        </div>

        <!-- 房間介紹文案：查看模式示範已儲存內容，無編輯按鈕；
             已儲存內容態靠左對齊（2026-07-31 使用者截圖覆核訂正，跟
             「尚未填寫」空狀態的置中不同） -->
        <div class="flex flex-col gap-2">
          <label class="text-base text-text-default">房間介紹文案</label>
          <div class="flex flex-col items-start gap-3 rounded-xl border border-border-default bg-surface-hover p-5">
            <span class="text-base text-brand-400">已儲存內容</span>
            <p class="text-base text-text-default text-left">
              設定房間名稱、代號、房型、床型、間數、定價、顯示分類與營運方式，並可上傳房間照片、補充設備與房價限制。完成後，系統將依設定內容顯示於訂房頁面，方便旅客快速了解房型資訊並進行預訂。
            </p>
          </div>
        </div>
        <!-- 房間名稱文案：查看模式維持空狀態，無編輯按鈕 -->
        <div class="flex flex-col gap-2">
          <label class="text-base text-text-default">房間名稱文案</label>
          <div class="flex flex-col items-center gap-3 rounded-xl border border-border-default bg-surface-hover p-5">
            <span class="text-base text-text-default">尚未填寫</span>
          </div>
        </div>

        <!-- 房間設施項目：全部 disabled 灰色，不保留選中藍色 -->
        <div class="flex flex-col gap-2 min-[640px]:col-span-2">
          <label class="text-base text-text-default">房間設施項目</label>
          <div class="flex flex-wrap gap-4 rounded-xl border border-border-default bg-surface-hover p-5">
            <button type="button" disabled class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-not-allowed">設施一</button>
            <button type="button" disabled class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-not-allowed">設施二</button>
            <button type="button" disabled class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-not-allowed">設施三</button>
            <button type="button" disabled class="room-type-facility-chip rounded-full px-4 py-2.5 text-base cursor-not-allowed">設施五六七八九</button>
          </div>
        </div>
      </div>
    </div>

    <div class="flex h-[58px] flex-shrink-0 items-center justify-end border-t border-border-disabled px-3">
      <button type="button" class="modal-close-btn inline-flex h-[34px] items-center justify-center rounded-md border border-border-disabled bg-text-default px-3 py-1.5 text-base text-text-inverse hover:opacity-80" data-modal="modalRoomTypeViewBackdrop">關閉</button>
    </div>
  </div>
</div>
