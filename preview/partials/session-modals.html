<!-- 共用 session modal partial（Stage 2，specs/page-architecture.md）
     內容自 landing.html 抽出：確定登出（Modal A）。
     （帳號切換 Modal B 於 2026-07-13 使用者訂正整組移除：aside/topbar 的
     快速切換帳號功能退役，觸發 icon 與 modal 一併刪除）
     aside 的 登出 icon 以 data-modal-open 觸發，aside 為全站共用
     partial，故此 modal 也必須全站存在。
     - landing.html / room-booking.html / order-processing.html 皆以
       js/partials.js async 注入
     - partial 內不放 script；開關由各頁 modal 系統的 delegated handler 處理 -->
    <!-- ====================================
         Modal A - 確定登出？
    ==================================== -->
    <div
      id="modalLogoutBackdrop"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalLogoutTitle"
    >
      <div class="modal-box">
        <!-- Header -->
        <div
          class="modal-header-shadow-soft flex items-center justify-between border-b border-border-focus px-3 py-3"
        >
          <span
            id="modalLogoutTitle"
            class="text-xl font-semibold text-text-default"
            >確定登出？</span
          >
          <button
            class="modal-close-btn w-6 h-6 flex items-center justify-center cursor-pointer opacity-70 hover:opacity-100"
            data-modal="modalLogoutBackdrop"
            aria-label="關閉"
          >
            <img src="./assets/icons/close.svg" alt="close" class="w-6 h-6" />
          </button>
        </div>
        <!-- Body -->
        <div
          class="px-3 py-3 border-b border-border-focus text-base text-text-default"
        >
          確定要登出系統嗎？
        </div>
        <!-- Footer -->
        <div class="flex justify-end gap-3 px-3 py-3">
          <button
            class="modal-close-btn px-3 py-1.5 rounded-md bg-border-disabled text-text-default text-base border border-border-disabled cursor-pointer hover:opacity-80"
            data-modal="modalLogoutBackdrop"
          >
            取消
          </button>
          <!-- 確定 = 登出動作屬後端；demo 行為與其他 modal 一致：點擊即關閉 -->
          <button
            class="modal-close-btn px-3 py-1.5 rounded-md bg-text-default text-text-inverse text-base border border-border-disabled cursor-pointer hover:opacity-80"
            data-modal="modalLogoutBackdrop"
          >
            確定
          </button>
        </div>
      </div>
    </div>
