<div
  id="modalQuantityGroupBackdrop"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="qpGroupModalTitle"
>
  <form id="qpGroupForm" class="modal-box qp-modal-box qp-group-modal">
    <header class="qp-modal-header">
      <h2 id="qpGroupModalTitle">群組編輯</h2>
      <button
        type="button"
        class="modal-close-btn qp-modal-close"
        data-modal="modalQuantityGroupBackdrop"
        aria-label="關閉"
      >
        <img src="./assets/icons/close.svg" alt="" />
      </button>
    </header>

    <div class="qp-modal-body qp-group-form">
      <div class="qp-group-fields">
        <label class="qp-group-field">
          <span>Set</span>
          <select id="qpGroupSet" aria-label="Set">
            <option value="option 1">option 1</option>
            <option value="option 2">option 2</option>
            <option value="option 3">option 3</option>
          </select>
        </label>
        <label class="qp-group-field">
          <span>To</span>
          <input id="qpGroupTo" type="number" value="0" aria-label="To" />
        </label>
        <label class="qp-group-field">
          <span>起始日</span>
          <input id="qpGroupStartDate" type="text" placeholder="0000-00-00" aria-label="起始日" />
        </label>
        <label class="qp-group-field">
          <span>截止日</span>
          <input id="qpGroupEndDate" type="text" placeholder="0000-00-00" aria-label="截止日" />
        </label>
      </div>

      <fieldset class="qp-group-weekdays">
        <legend>你想要改哪幾天？</legend>
        <div class="qp-weekday-scroll">
          <div class="qp-weekday-list">
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="1" aria-label="星期一" /><span>一</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="2" aria-label="星期二" /><span>二</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="3" aria-label="星期三" /><span>三</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="4" aria-label="星期四" /><span>四</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="5" aria-label="星期五" /><span>五</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="6" aria-label="星期六" /><span>六</span></label>
            <label class="qp-weekday-control"><input type="checkbox" name="weekday" value="0" aria-label="星期日" /><span>日</span></label>
          </div>
        </div>
      </fieldset>

      <div id="qpGroupLists" class="qp-group-lists" aria-label="群組清單"></div>

      <div class="qp-group-actions">
        <button type="button" class="qp-modal-action qp-cancel-button qp-group-clear" data-qp-group-clear>清除</button>
        <button type="button" class="modal-close-btn qp-modal-action qp-save-button qp-group-save" data-modal="modalQuantityGroupBackdrop">儲存變更</button>
      </div>
    </div>
  </form>
</div>

<div
  id="modalQuantityInventoryBackdrop"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="qpInventoryModalTitle"
>
  <form id="qpInventoryForm" class="modal-box qp-modal-box qp-inventory-modal">
    <header class="qp-modal-header">
      <h2 id="qpInventoryModalTitle">新增庫存</h2>
      <button
        type="button"
        class="modal-close-btn qp-modal-close"
        data-modal="modalQuantityInventoryBackdrop"
        aria-label="關閉"
      >
        <img src="./assets/icons/close.svg" alt="" />
      </button>
    </header>

    <div class="qp-modal-body qp-inventory-body">
      <div class="qp-inventory-scroll">
        <table class="qp-inventory-table" aria-label="新增庫存設定">
          <colgroup data-qp-inventory-columns></colgroup>
          <thead data-qp-inventory-head></thead>
          <tbody data-qp-inventory-rows></tbody>
        </table>
      </div>

      <div class="qp-inventory-actions">
        <button type="button" class="modal-close-btn qp-modal-action qp-cancel-button" data-modal="modalQuantityInventoryBackdrop">取消</button>
        <button type="button" class="modal-close-btn qp-modal-action qp-save-button" data-modal="modalQuantityInventoryBackdrop">儲存變更</button>
      </div>
    </div>
  </form>
</div>

<div
  id="modalQuantityPriceDetailBackdrop"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="qpDetailRoomTitle"
>
  <form id="qpDetailForm" class="modal-box qp-modal-box qp-detail-modal">
    <header class="qp-modal-header">
      <h2 id="qpDetailRoomTitle">景觀房</h2>
      <button
        type="button"
        class="modal-close-btn qp-modal-close"
        data-modal="modalQuantityPriceDetailBackdrop"
        aria-label="關閉"
      >
        <img src="./assets/icons/close.svg" alt="" />
      </button>
    </header>

    <div class="qp-modal-body qp-detail-body">
      <div class="qp-detail-copy">
        <strong id="qpDetailRatePlan">Standar Rate-447</strong>
        <span id="qpDetailDate">0000-00-00</span>
      </div>

      <button
        type="button"
        class="qp-pill-button"
        data-modal-open="modalQuantityGroupBackdrop"
      >
        <img src="./assets/icons/document-multiple-02.svg" alt="" />
        <span>群組編輯</span>
      </button>

      <div class="qp-detail-radio-list">
        <label><input type="radio" name="qp-detail-room-status" value="open" /> 開房</label>
        <label><input type="radio" name="qp-detail-room-status" value="closed" checked /> 關房</label>
      </div>

      <div class="qp-detail-actions">
        <button type="button" class="modal-close-btn qp-modal-action qp-cancel-button" data-modal="modalQuantityPriceDetailBackdrop">取消</button>
        <button type="button" class="modal-close-btn qp-modal-action qp-save-button" data-modal="modalQuantityPriceDetailBackdrop">儲存變更</button>
      </div>
    </div>
  </form>
</div>
