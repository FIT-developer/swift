<div
  id="modalProjectContentBackdrop"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="pcwTitle"
>
  <form id="pcProjectForm" class="modal-box pcw-modal-box pcw-modal-box--step-1">
    <header class="pcw-header">
      <div class="pcw-heading">
        <h2 id="pcwTitle" class="pcw-title" data-pcw-title>新增</h2>
        <p class="pcw-subtitle" data-pcw-subtitle>專案</p>
      </div>
      <button
        type="button"
        class="modal-close-btn pcw-close"
        data-modal="modalProjectContentBackdrop"
        aria-label="關閉"
      >
        <img src="./assets/icons/close.svg" alt="" />
      </button>
      <ol class="pcw-step-indicator" aria-label="目前步驟">
        <li class="pcw-step-dot is-active" data-pcw-step-dot="1" aria-current="step">
          <img src="./assets/icons/number-1.svg" alt="" />
        </li>
        <li class="pcw-step-connector" aria-hidden="true"></li>
        <li class="pcw-step-dot" data-pcw-step-dot="2">
          <img src="./assets/icons/number-2.svg" alt="" />
        </li>
        <li class="pcw-step-connector" aria-hidden="true"></li>
        <li class="pcw-step-dot" data-pcw-step-dot="3">
          <img src="./assets/icons/number-3.svg" alt="" />
        </li>
      </ol>
    </header>

    <div class="pcw-body">
      <section class="pcw-step-panel" data-pcw-step="1" aria-label="專案">
        <div class="pcw-project-grid">
          <label class="pcw-field">
            <span class="pcw-field-label">專案代號</span>
            <input class="pcw-input" type="text" name="projectCode" value="12" readonly />
          </label>
          <label class="pcw-field">
            <span class="pcw-field-label">專案名稱</span>
            <input class="pcw-input" type="text" name="projectName" value="" data-pcw-field="projectName" />
          </label>

          <label class="pcw-field">
            <span class="pcw-field-label">專案類型</span>
            <input class="pcw-input" type="text" name="projectType" value="住宿專案" readonly />
          </label>
          <label class="pcw-field">
            <span class="pcw-field-label">計價方式</span>
            <select class="pcw-input" name="pricingMethod">
              <option selected>間數</option>
            </select>
          </label>

          <div class="pcw-field">
            <span class="pcw-field-label">加人</span>
            <label class="member-data-switch">
              <input type="checkbox" name="extraPerson" role="switch" aria-label="加人" />
              <span class="member-data-switch-track" aria-hidden="true"></span>
              <span class="member-data-switch-knob" aria-hidden="true"></span>
            </label>
          </div>
          <label class="pcw-field">
            <span class="pcw-field-label">排序</span>
            <input class="pcw-input" type="text" name="sortOrder" value="999" />
          </label>

          <div class="pcw-field">
            <span class="pcw-field-label">退款</span>
            <label class="member-data-switch">
              <input type="checkbox" name="refund" role="switch" aria-label="退款" />
              <span class="member-data-switch-track" aria-hidden="true"></span>
              <span class="member-data-switch-knob" aria-hidden="true"></span>
            </label>
          </div>
          <div class="pcw-field">
            <label class="pcw-field-label" for="pcwMealPlan">含餐</label>
            <span class="pcw-select-info">
              <select id="pcwMealPlan" class="pcw-input" name="mealPlan">
                <option selected>YES</option>
              </select>
              <button
                type="button"
                class="pcw-info-button"
                aria-describedby="pcwMealTooltip"
                aria-label="含餐說明"
              >
                <img src="./assets/icons/info.svg" alt="" />
              </button>
              <span id="pcwMealTooltip" class="pcw-tooltip" role="tooltip">說明內容</span>
            </span>
          </div>

          <div class="pcw-field pcw-date-field">
            <span class="pcw-field-label">專案期間</span>
            <div class="pcw-date-range">
              <label class="pcw-date-input-wrap">
                <span class="sr-only">專案開始日期</span>
                <input class="pcw-input" type="text" name="projectStart" value="2026-02-10" />
                <img src="./assets/icons/calendar.svg" alt="" />
              </label>
              <span class="pcw-date-separator" aria-hidden="true">~</span>
              <label class="pcw-date-input-wrap">
                <span class="sr-only">專案結束日期</span>
                <input class="pcw-input" type="text" name="projectEnd" value="2026-03-11" />
                <img src="./assets/icons/calendar.svg" alt="" />
              </label>
            </div>
          </div>
          <div class="pcw-field pcw-date-field">
            <span class="pcw-field-label">上架期限</span>
            <div class="pcw-date-range">
              <label class="pcw-date-input-wrap">
                <span class="sr-only">上架開始日期</span>
                <input class="pcw-input" type="text" name="publishStart" value="2026-02-10" />
                <img src="./assets/icons/calendar.svg" alt="" />
              </label>
              <span class="pcw-date-separator" aria-hidden="true">~</span>
              <label class="pcw-date-input-wrap">
                <span class="sr-only">上架結束日期</span>
                <input class="pcw-input" type="text" name="publishEnd" value="2026-03-11" />
                <img src="./assets/icons/calendar.svg" alt="" />
              </label>
            </div>
          </div>

          <div class="pcw-field pcw-duration-field" role="group" aria-labelledby="pcwDurationLabel">
            <span id="pcwDurationLabel" class="pcw-field-label">專案天數</span>
            <label class="pcw-radio-option">
              <input type="radio" name="durationRule" value="equal" />
              <span>等於</span>
            </label>
            <label class="pcw-radio-option">
              <input type="radio" name="durationRule" value="at-least" checked />
              <span>至少</span>
            </label>
            <input class="pcw-input pcw-duration-input" type="text" name="duration" value="1" aria-label="專案天數" />
            <span>夜</span>
          </div>

          <div class="pcw-field pcw-room-types" role="group" aria-labelledby="pcwRoomTypesLabel">
            <span id="pcwRoomTypesLabel" class="pcw-field-label">專案房型</span>
            <div class="pcw-room-type-options">
              <label class="pcw-check-option"><input type="checkbox" name="roomTypes" value="all" /><span>全選</span></label>
              <label class="pcw-check-option"><input type="checkbox" name="roomTypes" value="one" /><span>方案一</span></label>
              <label class="pcw-check-option"><input type="checkbox" name="roomTypes" value="two" /><span>方案二</span></label>
              <span class="pcw-room-type-last">
                <label class="pcw-check-option"><input type="checkbox" name="roomTypes" value="three" /><span>方案三</span></label>
                <button type="button" class="pcw-add-button">加</button>
              </span>
            </div>
          </div>
          <label class="pcw-field pcw-booking-days">
            <span class="pcw-field-label pcw-label-with-note">
              <span>提前訂位</span>
              <small>註：1 表示今天只能訂明天之後的...</small>
            </span>
            <span class="pcw-number-unit">
              <input class="pcw-input" type="text" name="advanceBookingDays" value="12" />
              <span>天</span>
            </span>
          </label>

          <label class="pcw-field pcw-network-days">
            <span class="pcw-field-label pcw-label-with-note">
              <span>網路開放</span>
              <small>註 註 註 註 註 註 註 註 註 註 註 註 註 註 註</small>
            </span>
            <span class="pcw-number-unit">
              <input class="pcw-input" type="text" name="networkOpenDays" value="12" />
              <span>天</span>
            </span>
          </label>

          <div class="pcw-copy-grid">
            <article class="pcw-copy-card">
              <h3>專案名稱文案</h3>
              <div class="pcw-copy-content">
                <p>尚未填寫</p>
                <button type="button" class="pcw-edit-copy">
                  <img src="./assets/icons/edit.svg" alt="" />
                  <span>編輯</span>
                </button>
              </div>
            </article>
            <article class="pcw-copy-card">
              <h3>專案介紹文案</h3>
              <div class="pcw-copy-content">
                <p>尚未填寫</p>
                <button type="button" class="pcw-edit-copy">
                  <img src="./assets/icons/edit.svg" alt="" />
                  <span>編輯</span>
                </button>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section class="pcw-step-panel" data-pcw-step="2" aria-label="日期" hidden></section>
      <section class="pcw-step-panel" data-pcw-step="3" aria-label="價格" hidden></section>
    </div>

    <footer class="pcw-footer">
      <div class="pcw-footer-row" data-pcw-footer="1">
        <span></span>
        <span class="pcw-footer-actions">
          <button type="button" class="pcw-footer-button pcw-footer-button--secondary" data-pcw-clear>清除</button>
          <button type="button" class="pcw-footer-button pcw-footer-button--primary" data-pcw-next>下一頁</button>
        </span>
      </div>
      <div class="pcw-footer-row" data-pcw-footer="2" hidden>
        <button type="button" class="pcw-footer-button pcw-footer-button--primary" data-pcw-previous>上一頁</button>
        <span class="pcw-footer-actions">
          <button type="button" class="pcw-footer-button pcw-footer-button--secondary" data-pcw-clear>清除</button>
          <button type="button" class="pcw-footer-button pcw-footer-button--primary" data-pcw-next>下一頁</button>
        </span>
      </div>
      <div class="pcw-footer-row" data-pcw-footer="3" hidden>
        <button type="button" class="pcw-footer-button pcw-footer-button--primary" data-pcw-previous>上一頁</button>
        <span class="pcw-footer-actions">
          <button type="button" class="pcw-footer-button pcw-footer-button--secondary" data-pcw-clear>清除</button>
          <button
            type="button"
            class="modal-close-btn pcw-footer-button pcw-footer-button--primary"
            data-modal="modalProjectContentBackdrop"
            data-pcw-save
          >
            儲存
          </button>
        </span>
      </div>
    </footer>
  </form>
</div>
