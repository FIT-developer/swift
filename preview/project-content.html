<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift - 專案內容</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="./assets/css/base.css" rel="stylesheet" />
    <link href="./assets/css/app.css" rel="stylesheet" />
  </head>
  <body data-page="專案內容">
    <div
      id="rootWrap"
      class="mx-auto flex min-h-screen max-w-[1440px] flex-col gap-3 md:p-3"
    >
      <div class="flex items-center justify-between px-3 pt-3 md:hidden">
        <a href="./landing.html" aria-label="回今日總覽">
          <img src="./assets/icons/logo.svg" class="h-6" alt="Swift" />
        </a>
        <button
          id="mobileMenuBtn"
          type="button"
          class="cursor-pointer rounded-md p-1 opacity-70 hover:opacity-100"
          aria-label="開啟選單"
        >
          <img src="./assets/icons/folder.svg" class="h-5 w-6" alt="" />
        </button>
      </div>

      <div id="bodyArea" class="flex min-w-0 flex-1 flex-col gap-3 md:flex-row">
        <div data-partial="aside"></div>

        <div id="mainColumn" class="flex min-w-0 flex-1 flex-col gap-3">
          <div data-partial="topbar"></div>

          <main class="flex min-w-0 flex-1 flex-col">
            <section class="pc-page-panel" aria-labelledby="projectContentTitle">
              <div class="pc-page-actions">
                <h1 id="projectContentTitle" class="sr-only">專案內容</h1>
                <button
                  type="button"
                  class="pc-pill-button"
                  data-modal-open="modalProjectContentBackdrop"
                  data-pc-modal-mode="new"
                  data-pc-open-wizard
                >
                  <img src="./assets/icons/outline-plus.svg" alt="" />
                  <span>新增</span>
                </button>
              </div>

              <div class="pc-kind-tabs" role="tablist" aria-label="專案類型">
                <button
                  type="button"
                  class="pc-kind-tab is-active"
                  role="tab"
                  aria-selected="true"
                  data-pc-kind="lodging"
                >
                  住宿
                </button>
                <button
                  type="button"
                  class="pc-kind-tab"
                  role="tab"
                  aria-selected="false"
                  data-pc-kind="channel"
                >
                  串接
                </button>
              </div>

              <div class="pc-content-card">
                <div class="pc-status-tabs" role="group" aria-label="專案狀態">
                  <button type="button" class="member-data-filter-tab is-active" data-pc-status="all" aria-pressed="true">
                    全部 <span class="font-normal">（<span data-pc-status-count>0</span>）</span>
                  </button>
                  <button type="button" class="member-data-filter-tab" data-pc-status="online" aria-pressed="false">
                    上架 <span class="font-normal">（<span data-pc-status-count>0</span>）</span>
                  </button>
                  <button type="button" class="member-data-filter-tab" data-pc-status="offline" aria-pressed="false">
                    停用 <span class="font-normal">（<span data-pc-status-count>0</span>）</span>
                  </button>
                </div>

                <div class="pc-toolbar">
                  <div class="pc-expiry-filters" role="group" aria-label="期限">
                    <button type="button" class="pc-expiry-filter is-active" data-pc-expiry="unexpired" aria-pressed="true">未逾期</button>
                    <button type="button" class="pc-expiry-filter" data-pc-expiry="expired" aria-pressed="false">已逾期</button>
                  </div>
                  <button
                    type="button"
                    class="pc-gha-open"
                    data-modal-open="modalProjectGhaBackdrop"
                    data-pc-open-gha
                  >
                    GHA
                  </button>
                  <label class="pc-room-filter">
                    <span>房型套用</span>
                    <select data-pc-room-filter aria-label="房型套用">
                      <option value="all" selected>全部</option>
                      <option value="sb">（SB）威尼斯一百人隨住隨案</option>
                      <option value="tw">（TW）台灣好行</option>
                    </select>
                  </label>
                </div>

                <div class="pc-card-grid" data-pc-card-grid aria-live="polite"></div>

                <div class="pc-sort-actions" data-pc-sort-actions>
                  <span class="pc-sort-save-status" data-pc-save-status aria-live="polite"></span>
                  <button type="button" class="pc-save-sort" data-pc-save-sort data-pc-saved-count="0">
                    儲存排序
                  </button>
                </div>
              </div>
            </section>
          </main>
        </div>
      </div>
    </div>

    <div
      id="mobileSidebarBackdrop"
      class="mobile-sidebar-backdrop md:hidden"
      aria-hidden="true"
    ></div>

    <div data-partial="session-modals"></div>
    <div data-partial="topbar-modals"></div>
    <div data-partial="project-content-modals"></div>
    <div data-partial="project-content-extras"></div>

    <script type="module">
      import { loadPartials } from "./js/partials.js";
      import { initPageShell } from "./js/page-shell.js";
      import { initPageTabs } from "./js/page-tabs.js";
      import { initProjectContent } from "./js/project-content.js";
      import { createModalController } from "./js/modal-controller.js";
      import { initTopbarModals } from "./js/topbar-modals.js";

      await loadPartials();
      initPageShell();
      initPageTabs();
      const projectContent = initProjectContent();
      createModalController({ beforeOpen: projectContent.beforeOpen });
      initTopbarModals();
    </script>
  </body>
</html>
