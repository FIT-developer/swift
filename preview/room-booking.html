<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift - 房間預定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <!-- calendar（[A] 庫存/空房 + rb-cal-cell 日期格）依賴 dayjs，與 landing 同版本 -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isoWeek.js"></script>
    <!-- 到店方式 modal 接送雙卡片堆疊依賴 Swiper，與 landing 同版本 -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="./assets/css/base.css" rel="stylesheet" />
    <link href="./assets/css/app.css" rel="stylesheet" />
  </head>
  <body data-page="房間預定">
    <div
      id="rootWrap"
      class="flex flex-col gap-3 min-h-screen max-w-[1440px] mx-auto p-3"
    >
      <!-- Mobile top bar (page shell; desktop top row is partials/topbar.html) -->
      <div class="flex items-center justify-between md:hidden">
        <a href="./landing.html" aria-label="回今日總覽">
          <img src="./assets/icons/logo.svg" class="h-6" alt="Swift" />
        </a>
        <button
          id="mobileMenuBtn"
          class="p-1 rounded-md cursor-pointer opacity-70 hover:opacity-100"
          aria-label="開啟選單"
        >
          <img src="./assets/icons/folder.svg" class="w-6 h-5" alt="選單" />
        </button>
      </div>

      <div id="bodyArea" class="flex flex-col md:flex-row gap-3 flex-1 min-w-0">
        <div data-partial="aside"></div>

        <div id="mainColumn" class="flex-1 flex flex-col min-w-0 gap-3">
          <div data-partial="topbar"></div>

          <main class="flex-1 flex flex-col min-w-0 w-full">
            <!-- 頁面內容 = partials/room-booking-sections.html（[A]-[E] 4 區塊
                 + 產生訂單 button），與訂單修改 modal body 共用單一來源。
                 行為 root-scope 綁定在本容器（modal 行為由 order-modals.js 管） -->
            <div id="rbPageContent" class="flex flex-col min-w-0">
              <div data-partial="room-booking-sections"></div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <div
      id="mobileSidebarBackdrop"
      class="mobile-sidebar-backdrop md:hidden"
      aria-hidden="true"
    ></div>

    <!-- 共用 modal 群（房型介紹 / 訂房明細編輯 / 加購 / 訂單明細 / 簡訊 /
         到店方式 / 會員資料 / 更換合約公司 / 庫存月曆 offcanvas） -->
    <div data-partial="room-booking-modals"></div>
    <!-- 確定登出 / 帳號切換（aside 觸發，全站共用） -->
    <div data-partial="session-modals"></div>
    <!-- topbar 系統商公告/會員安全管理（2026-07-08 起三頁共用，見
         partials/topbar-modals.html 檔頭說明） -->
    <div data-partial="topbar-modals"></div>

    <script type="module">
      import { loadPartials } from "./js/partials.js";
      import { initPageShell } from "./js/page-shell.js";
      import { initPageTabs } from "./js/page-tabs.js";
      import { initRoomBookingBehaviors } from "./js/room-booking-behaviors.js";
      import { initOrderModals } from "./js/order-modals.js";
      import { initArrivalMethodModal } from "./js/arrival-method-modal.js";
      import { initTopbarModals } from "./js/topbar-modals.js";

      await loadPartials();
      // page shell：aside accordion / 收合全部 / mobile drawer
      initPageShell();
      // topbar page tab chips：sessionStorage 多 tab 共存 + 關閉行為
      initPageTabs();
      // [A]-[E] 區塊行為，root-scope = 頁面內容容器
      // （不含 modal 群 - modal 行為由 initOrderModals 綁定，避免重複）
      initRoomBookingBehaviors(document.getElementById("rbPageContent"));
      // modal 系統：開關核心 + 訂單明細/簡訊 + 加購渲染 + 會員資料/合約公司/
      // 訂房明細編輯（本頁無訂單修改入口，op 專屬接線自然 no-op）
      var modalApi = initOrderModals();
      // 到店方式完整互動（chip 切換 / stepper / 接送 swiper / 生效日 calendar）
      initArrivalMethodModal(modalApi);
      // topbar 系統商公告/會員安全管理內部行為（2026-07-08 起三頁共用）
      initTopbarModals();
    </script>
  </body>
</html>
