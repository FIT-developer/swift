<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日訂單來源分佈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/base.css">
  <style>
    .card {
      background: var(--color-neutral-0);
      border: 1px solid var(--color-neutral-200);
      border-radius: 8px;
      width: 367px;
      padding: 12px;
      position: relative;
    }

    /* Legend */
    .legend { display: flex; align-items: center; gap: 16px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-400); }
    .legend-swatch { width: 28px; height: 14px; border-radius: 2px; flex-shrink: 0; }
    .chart-title { color: var(--color-text-800); }
    .chart-wrapper { position: relative; width: 343px; height: 343px; margin: 0 auto; }
    .legend-swatch-ota { background: var(--color-radio-default); }
    .legend-swatch-official { background: var(--color-chart-green); }
    .legend-swatch-phone { background: var(--color-text-300); }

    /* Tooltip */
    .chart-tooltip {
      position: absolute;
      background: var(--color-text-700);
      color: var(--color-text-100);
      border-radius: 6px;
      padding: 2px 12px;
      font-size: 12px;
      line-height: 1.7;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .chart-tooltip.visible { opacity: 1; }
    /* Arrow pointing right (toward chart center) */
    .chart-tooltip::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 5px 0 5px 6px;
      border-style: solid;
      border-color: transparent transparent transparent var(--color-text-700);
    }

    /* State tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 5px 14px; border-radius: 9999px;
      border: 1px solid var(--color-neutral-200); background: var(--color-neutral-0);
      font-size: 13px; color: var(--color-text-800); cursor: pointer;
    }
    .tab.active { background: var(--color-text-800); color: var(--color-neutral-0); border-color: var(--color-text-800); }
  </style>
</head>
<body class="bg-surface-default min-h-screen flex flex-col items-center justify-center p-10">

  <h1 class="text-lg font-semibold text-text-default mb-5">chartjs - doughnut</h1>

  <div class="tabs" id="tabs">
    <button class="tab active" data-state="default">Default</button>
    <button class="tab"        data-state="hover">hover</button>
  </div>

  <div class="card" id="card">
    <!-- Title -->
    <p class="chart-title text-center text-xs mb-2">今日訂單來源分佈</p>

    <!-- Legend -->
    <div class="legend mb-3">
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-ota"></span>OTA
      </div>
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-official"></span>官網
      </div>
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-phone"></span>電話/現場
      </div>
    </div>

    <!-- Chart wrapper -->
    <div class="chart-wrapper">
      <canvas id="chart" width="343" height="343"></canvas>
      <!-- Custom tooltip -->
      <div class="chart-tooltip" id="tooltip">
        <div id="tt-label"></div>
        <div id="tt-value"></div>
      </div>
    </div>
  </div>

  <script>
  // ── Data ──────────────────────────────────────────────────────────────────────
  const LABELS = ['OTA', '官網', '電話/現場'];
  const VALUES = [302, 138, 110];          // total ≈ 550
  // Base segment colors pulled from base.css token vars so a token rename / hex change propagates here.
  const cs = getComputedStyle(document.documentElement);
  const COLORS = [
    cs.getPropertyValue('--color-radio-default').trim(),
    cs.getPropertyValue('--color-chart-green').trim(),
    cs.getPropertyValue('--color-text-300').trim(),
  ];
  const HOVER_COLORS = [
    cs.getPropertyValue('--color-radio-hover').trim(),
    cs.getPropertyValue('--color-surface-status-positive').trim(),
    cs.getPropertyValue('--color-text-400').trim(),
  ];

  // ── Chart ─────────────────────────────────────────────────────────────────────
  let chart = null;

  function buildChart(showStaticTooltip) {
    if (chart) { chart.destroy(); chart = null; }

    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: LABELS,
        datasets: [{
          data: VALUES,
          backgroundColor: COLORS,
          hoverBackgroundColor: HOVER_COLORS,
          borderWidth: 0,
        }],
      },
      options: {
        responsive: false,
        cutout: '62%',
        animation: { duration: 300 },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: externalTooltip,
          },
        },
      },
    });

    // For hover state: show static tooltip on "電話/現場" segment
    if (showStaticTooltip) {
      setTimeout(() => showStatic(), 350);
    } else {
      hideTooltip();
    }
  }

  // ── External tooltip ──────────────────────────────────────────────────────────
  function externalTooltip({ chart: c, tooltip: model }) {
    const el = document.getElementById('tooltip');
    if (model.opacity === 0 || !model.dataPoints?.length) {
      hideTooltip(); return;
    }
    const dp = model.dataPoints[0];
    positionTooltip(el, dp.label, dp.raw, dp.dataIndex);
  }

  function positionTooltip(el, label, value, segIndex) {
    document.getElementById('tt-label').textContent = label;
    document.getElementById('tt-value').textContent = value;

    // Calculate segment midpoint angle for positioning
    const meta = chart.getDatasetMeta(0);
    const arc  = meta.data[segIndex];
    const midAngle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;

    // Radius to place tooltip (just inside outer edge)
    const outerR = arc.outerRadius;
    const r = outerR * 0.65;

    const cx = arc.x + Math.cos(midAngle) * r;
    const cy = arc.y + Math.sin(midAngle) * r;

    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    el.classList.add('visible');
  }

  function hideTooltip() {
    document.getElementById('tooltip').classList.remove('visible');
  }

  // Show static tooltip on 電話/現場 (index 2) for hover state
  function showStatic() {
    if (!chart) return;
    positionTooltip(document.getElementById('tooltip'), '電話/現場', 110, 2);
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────────
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    buildChart(btn.dataset.state === 'hover');
  });

  // Init
  buildChart(false);
  </script>
</body>
</html>
